<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit capture · Recall</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.4l6.1-.9L12 3Z"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M10 13h4"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.3 7.4"/><path d="M4 4v6h6"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7L11 6.8"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.3-1.3"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20 13.5 13.5 20a2 2 0 0 1-2.8 0L4 13.3V4h9.3l6.7 6.7a2 2 0 0 1 0 2.8Z"/><circle cx="8.5" cy="8.5" r="1.2"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v10l-5 5H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M15 20v-5h5"/><path d="M8 9h8M8 12.5h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    </svg>

    <main class="editor-app">
      <header class="topbar editor-topbar">
        <div class="brand">
          <div class="brand-mark editor-brand-mark" aria-hidden="true"><span>R</span></div>
          <div class="brand-copy">
            <p class="eyebrow">Recall</p>
            <h1>Edit capture</h1>
          </div>
        </div>
        <button id="editor-close" class="icon-btn" type="button" title="Close editor" aria-label="Close editor">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </header>

      <p class="hint editor-subtitle">
        Changes are encrypted on this device and queued for sync.
      </p>

      <section id="editor-loading" class="editor-state">
        <span class="editor-spinner" aria-hidden="true"></span>
        <p>Opening capture…</p>
      </section>

      <section id="editor-locked" class="editor-state" hidden>
        <svg class="icon editor-state-icon"><use href="#i-lock"/></svg>
        <h2>Recall is locked</h2>
        <p id="editor-locked-copy">Unlock Recall from the toolbar, then try again.</p>
        <div class="editor-state-actions">
          <button id="editor-retry" class="btn btn-primary btn-sm" type="button">Try again</button>
          <button id="editor-locked-close" class="btn btn-ghost btn-sm" type="button">Close</button>
        </div>
      </section>

      <form id="editor-form" class="editor-form" hidden>
        <div class="editor-card">
          <div class="editor-heading-row">
            <div>
              <p id="editor-meta" class="meta editor-meta"></p>
              <p id="editor-title-preview" class="editor-title-preview"></p>
            </div>
            <span id="editor-archived-pill" class="pill editor-archived-pill" hidden>Archived</span>
          </div>
          <img id="editor-image" alt="" hidden />
        </div>

        <label class="field">
          <span class="field-label">Title</span>
          <input id="editor-title" type="text" maxlength="300" placeholder="Optional title" autocomplete="off" />
        </label>

        <label class="field">
          <span class="field-label">Text</span>
          <textarea id="editor-text" rows="9" maxlength="20000" placeholder="Write or paste the content"></textarea>
        </label>

        <label class="field">
          <span class="field-label">Link</span>
          <input id="editor-url" type="url" maxlength="4000" placeholder="https://…" autocomplete="off" />
        </label>

        <label id="editor-ocr-field" class="field" hidden>
          <span class="field-label">Recognized text</span>
          <textarea id="editor-ocr" rows="5" maxlength="20000" placeholder="Text found in the screenshot"></textarea>
        </label>

        <section class="editor-tags">
          <div class="editor-section-head">
            <span class="field-label"><svg class="icon icon-sm"><use href="#i-tag"/></svg> Tags</span>
            <span id="editor-tag-count" class="field-hint">0/8</span>
          </div>
          <div id="editor-tags" class="tag-list"></div>
          <div class="tag-form">
            <input id="editor-tag-input" type="text" maxlength="32" placeholder="Add a tag" aria-label="Add a tag" autocomplete="off" />
            <button id="editor-tag-add" class="btn btn-ghost btn-sm" type="button">Add</button>
          </div>
        </section>

        <p id="editor-error" class="error" hidden></p>
        <p id="editor-notice" class="editor-notice" hidden></p>

        <div class="editor-actions">
          <button id="editor-save" class="btn btn-primary" type="submit">Save changes</button>
          <button id="editor-open" class="btn btn-ghost" type="button" hidden>
            <svg class="icon icon-sm"><use href="#i-link"/></svg> Open page
          </button>
        </div>

        <div class="editor-footer-actions">
          <button id="editor-favorite" class="action-chip" type="button" aria-pressed="false">
            <svg class="icon icon-sm"><use href="#i-star"/></svg> <span>Favorite</span>
          </button>
          <button id="editor-archive" class="action-chip" type="button">
            <svg class="icon icon-sm"><use href="#i-archive"/></svg> <span>Archive</span>
          </button>
          <button id="editor-done" class="btn btn-ghost btn-sm" type="button">Done</button>
        </div>
      </form>
    </main>

    <script type="module" src="editor/main.js"></script>
  </body>
</html>
